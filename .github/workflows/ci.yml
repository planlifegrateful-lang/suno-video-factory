name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'customer-music-store/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure + server syntax + customer store
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check sync_server
        run: python3 -m py_compile server/sync_server.py

      - name: Required files present
        run: |
          test -f README.md
          test -f LAUNCH.md
          test -f OPERATOR.md
          test -f PRODUCTION_SYSTEM.md
          test -f server/sync_server.py
          test -f capcut/EASY-MODE.md
          test -f templates/job-manifest.json
          test -f content-calendar/14-day-plan.md
          echo "Structure OK"

      - name: Validate customer music store
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          page = Path("customer-music-store/index.html").read_text()
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  self.ids.update(v for k, v in attrs if k == "id")

          parser = Check()
          parser.feed(page)
          required = {"search", "filter", "catalog", "selected", "total", "all", "clear", "checkout", "status"}
          missing = required - parser.ids
          if missing:
              raise SystemExit(f"Missing customer controls: {sorted(missing)}")
          if len(re.findall(r'\{id:"', page)) != 5:
              raise SystemExit("Expected five documented song entries")
          scripts = re.findall(r"<script>(.*?)</script>", page, re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected one inline application script")
          Path("/tmp/customer-store.js").write_text(scripts[0])
          print("Customer catalog structure: PASS")
          PY
          node --check /tmp/customer-store.js
